<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin &middot; Mindtickle FIFA Championship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Work+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="admin-shell">
    <div class="top-bar">
      <h1 style="font-size:20px;margin:0;">Admin</h1>
      <a class="link" href="/">&larr; Back to Match Centre</a>
    </div>

    <div id="loginCard" class="card">
      <h2>Sign in</h2>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <div id="loginError" class="error-msg"></div>
      <button id="loginBtn">Sign in</button>
    </div>

    <div id="adminPanel" style="display:none;">
      <div class="top-bar">
        <div></div>
        <button class="secondary" id="logoutBtn">Log out</button>
      </div>

      <div class="card">
        <h2>Add fixture</h2>
        <p style="margin:0;color:var(--muted);font-size:12px;">Team A is the home side, Team B is the away side &mdash; add each pairing twice, swapping home/away, for the reverse fixture.</p>
        <label for="teamA">Team A (home)</label>
        <input id="teamA" type="text" />
        <label for="teamB">Team B (away)</label>
        <input id="teamB" type="text" />
        <label for="group">Group / stage</label>
        <input id="group" type="text" placeholder="e.g. Group A, Semi Final" />
        <label for="kickoff">Kickoff</label>
        <input id="kickoff" type="datetime-local" />
        <div id="addError" class="error-msg"></div>
        <button id="addMatchBtn">Add fixture</button>
      </div>

      <div class="card">
        <h2>Matches</h2>
        <div id="matchList"></div>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
